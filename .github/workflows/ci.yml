name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Ubuntu restricts user namespaces for downloaded binaries without a named AppArmor profile.
      # Grant them only to our exact Chromium paths on this ephemeral hosted runner; retain Chromium's sandbox.
      - name: Configure sandbox namespaces for Chromium (Linux)
        if: runner.os == 'Linux'
        run: node .github/scripts/setup-browser-sandbox.mjs
      - name: Static checks
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Service lifecycle and local OAuth protocol contract
        run: npm run test:readiness -- "$RUNNER_TEMP/sitefenn-readiness"
      - name: Browser end-to-end tests
        run: npm run test:e2e
